<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E676;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded Rectangle Background -->
  <rect width="512" height="512" rx="110" fill="url(#greenGradient)" filter="url(#shadow)"/>
  
  <!-- Leaf Shape -->
  <g transform="translate(256, 256)">
    <!-- Main Leaf Body -->
    <path d="M 0,-120 Q -60,-80 -80,-20 Q -90,20 -70,60 Q -50,90 0,110 Q 50,90 70,60 Q 90,20 80,-20 Q 60,-80 0,-120 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Leaf Vein -->
    <line x1="0" y1="-120" x2="0" y2="110" stroke="white" stroke-width="6" opacity="0.3"/>
    
    <!-- Currency Symbol (Rupee ₹) -->
    <g transform="translate(0, -10)">
      <!-- Rupee Symbol -->
      <path d="M -25,0 L 25,0 M -25,15 L 25,15 M 0,0 L 0,50 L -20,50" 
            stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0,50 L 25,20" 
            stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Small CO₂ Text at bottom -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
          fill="white" text-anchor="middle" opacity="0.8">CO₂</text>
  </g>
</svg>
